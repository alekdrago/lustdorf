<style>
/* Layout: full-screen plan canvas; slim top bar (sheet + time + sync), tool rail at bottom, slide-up panel for a mark. */
:root{
  --bg:#eef0f2; --paper:#ffffff; --ink:#1d232b; --muted:#5d6672; --line:#c9cfd6;
  --wall:#9aa3ad; --axis:#c2413a; --accent:#1f4fa8; --accent-ink:#ffffff;
  --mark:#d0261d; --zone:#d0261d; --photo:#1f4fa8; --ok:#2a7a3e; --warn:#b26a00;
  --panel:#ffffff; --chip:#e7ebf0;
  --f-ui:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
}

  --mark:#ff5a4c; --zone:#ff5a4c; --photo:#7fa8f5; --ok:#5cc27a; --warn:#e8a33a;
  --panel:#20262e; --chip:#2b333d; color-scheme:dark}}

  --wall:#59636f; --axis:#e0675f; --accent:#6f9cf0; --accent-ink:#0f1520;
  --mark:#ff5a4c; --zone:#ff5a4c; --photo:#7fa8f5; --ok:#5cc27a; --warn:#e8a33a;
  --panel:#20262e; --chip:#2b333d; color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-left,0px)) 6px max(10px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
select,button,input,textarea{font:inherit;color:inherit}
#sheet{min-width:0;flex:1 1 180px;max-width:340px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-weight:600}
.pill{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.hbtn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;font-weight:600}
.hbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#stage{position:relative;flex:1;min-height:0;background:var(--paper);touch-action:none;overflow:hidden}
#plan{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#plan path{fill:none;stroke:var(--ink);stroke-width:1.1px;vector-effect:non-scaling-stroke}
#plan path.hf{fill:var(--wall);stroke:none}
#plan path.h{stroke:none}
#plan path.w{stroke-width:1.4px}
#plan path.ax{stroke:var(--axis);stroke-width:.7px;stroke-dasharray:12 3 2 3}
#plan path.dm{stroke:var(--muted);stroke-width:.6px}
#plan path.wn,#plan path.dr,#plan path.st,#plan path.rm{stroke-width:.7px}
#plan path.am{stroke-width:.9px}
#plan text{fill:var(--ink);font-family:var(--f-ui)}
#plan text.dm{fill:var(--muted)}
#marks *{vector-effect:non-scaling-stroke}
.mk-line{fill:none;stroke:var(--mark);stroke-linecap:round;stroke-linejoin:round}
.mk-zone{stroke:var(--zone);fill:var(--zone);fill-opacity:.16}
.mk-txt{fill:var(--mark);font-family:var(--f-num);font-weight:600;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.mk-photo{fill:var(--photo);stroke:var(--paper)}
.mk-cone{fill:var(--photo);fill-opacity:.22;stroke:var(--photo)}
.mk-sel{stroke:var(--accent);stroke-dasharray:6 4;fill:none}
#draft{fill:none;stroke:var(--accent);stroke-linecap:round}
#tools{display:flex;gap:6px;padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));background:var(--paper);border-top:1px solid var(--line);overflow-x:auto}
.tool{flex:1 0 auto;min-width:56px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:13px;letter-spacing:.02em}
.tool svg{width:22px;height:22px}
.phead{display:flex;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:-12px;background:var(--panel);padding-block:4px;z-index:1;flex-wrap:wrap}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tool:focus-visible,.hbtn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#hint{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:8px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:3px 8px;border-radius:6px;pointer-events:none;max-width:80%}
#zoombar{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px}
#zoombar button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:20px;font-weight:600}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:58%;overflow:auto;background:var(--panel);border-top:2px solid var(--accent);box-shadow:0 -8px 24px rgba(0,0,0,.18);padding:12px max(14px,env(safe-area-inset-left,0px)) 14px max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;z-index:5}
#panel h3{margin:0;font-size:17px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:100%}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 11px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 120px}
.fld input,.fld textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px;font-family:var(--f-num);min-width:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.pbtn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.pbtn.sec{background:var(--chip);color:var(--ink)}
label.pbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;cursor:pointer}
label.pbtn input{position:absolute;inset:0;opacity:0;font-size:200px;cursor:pointer}
.note{font-size:12px;color:var(--muted)}
.tbox{border:1px solid var(--photo);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.35}
.pbtn.del{background:transparent;color:var(--mark);border:1px solid var(--mark)}
.danger{color:var(--mark);font-weight:700}
#list{position:absolute;inset:0 0 0 auto;width:min(380px,92%);background:var(--panel);border-left:1px solid var(--line);overflow:auto;z-index:6;padding:12px max(14px,env(safe-area-inset-right,0px)) 14px 14px}
#list h3{margin:0 0 8px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.li b{font-size:14px} .li small{color:var(--muted);font-family:var(--f-num);font-size:11px}
.badge{font-family:var(--f-num);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--chip)}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:46px;background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:6px;font-size:13px;z-index:9;pointer-events:none}

<div id="app">

  </nav>
</div>

const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const ZONES = [['ruin','Руйнування / вивал'],['plaster','Відшарування штукатурки'],['wet','Замокання / грибок'],['fire','Сліди пожежі'],['ceil','Дефект перекриття / стелі'],['floor','Дефект підлоги'],['roof','Покрівля'],['other','Інше']];
const SIGNS = [['defl','Прогин / деформація'],['win','Вибите вікно / двері'],['meas','Місце виміру / розкриття'],['alarm','Аварійна ділянка'],['corr','Корозія арматури'],['other','Інше']];
const SURF = [['wall_in','Стіна (внутр.)'],['facade','Фасад'],['ceil','Стеля / перекриття'],['floor','Підлога'],['roof','Покрівля'],['col','Колона / стовп'],['lintel','Перемичка'],['stair','Сходи']];
const KIND = {photo:'Фото',crack:'Тріщина',zone:'Зона',sign:'Знак'};
const ZTXT = Object.fromEntries(ZONES), STXT = Object.fromEntries(SIGNS), SFTXT = Object.fromEntries(SURF);

/* ---------- local store (IndexedDB) ---------- */
let idb = null;
function openIdb(){return new Promise(res=>{try{const r=indexedDB.open('lustdorf-field',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('marks',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'});d.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function tx(store,mode,fn){return new Promise(res=>{if(!idb)return res(null);try{const t=idb.transaction(store,mode);const s=t.objectStore(store);const r=fn(s);t.oncomplete=()=>res(r&&r.result!==undefined?r.result:null);t.onerror=()=>res(null)}catch(e){res(null)}})}
const putLocal=(st,v)=>tx(st,'readwrite',s=>s.put(v));
const delLocal=(st,k)=>tx(st,'readwrite',s=>s.delete(k));
const allLocal=st=>tx(st,'readonly',s=>s.getAll());
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));

/* ---------- state ---------- */
const st = {sheet:SHEETS[0].id, tool:'pan', finger:false, marks:new Map(), photos:new Map(), sel:null, vb:null, undo:[]};
let db=null, assets=null, userId='me';
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now = () => new Date().toISOString();
const hhmm = iso => { const d=new Date(iso); return d.toTimeString().slice(0,5); };

/* ---------- sheet rendering ---------- */
const sheetById = id => SHEETS.find(s=>s.id===id);
function fillSelect(){
  const sel=$('#sheet'); sel.innerHTML='';
  for(const s of SHEETS){const o=document.createElement('option');o.value=s.id;o.textContent=`Літ. ${s.lit} — ${s.name} · ${s.floor}`;sel.appendChild(o)}
  sel.value=st.sheet;
}
function drawBase(){
  const s=sheetById(st.sheet);
  $('#base').innerHTML=s.svg;
  st.vb=[...s.vb]; st.fit=[...s.vb]; applyVB();
}
function applyVB(){ $('#plan').setAttribute('viewBox', st.vb.join(' ')); drawMarks(); }
function scale(){ const r=$('#plan').getBoundingClientRect(); return Math.max(st.vb[2]/r.width, st.vb[3]/r.height); } /* mm per px */

/* screen -> svg (svg y = -model y) */
function toSvg(ev){ const p=$('#plan'); const pt=p.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; const m=p.getScreenCTM().inverse(); const q=pt.matrixTransform(m); return [q.x,q.y]; }
const toModel = ([x,y]) => [Math.round(x), Math.round(-y)];
const fromModel = ([x,y]) => [x,-y];

/* ---------- marks rendering ---------- */
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function labelOf(m){
  if(m.kind==='crack'){let t=[m.w?m.w:'?',m.len?m.len:'?'].join('/');if(m.through)t+=' наскр.';return t}
  if(m.kind==='zone'){return (m.area?('≈'+m.area+' м²'):'')}
  if(m.kind==='sign'){return m.params||''}
  return '';
}
function drawMarks(){
  const g=$('#marks'); g.innerHTML='';
  const k=scale(); /* mm per screen px */
  for(const m of st.marks.values()){
    if(m.sheet!==st.sheet||m.deleted)continue;
    const pts=m.pts.map(fromModel);
    const sel = st.sel===m.id;
    const grp=el('g',{'data-id':m.id},g);
    const sw=(m.danger?3.2:2)+'px';
    if(m.kind==='crack'){
      el('polyline',{points:pts.map(p=>p.join(',')).join(' '),class:'mk-line','stroke-width':sw},grp);
      if(sel) el('polyline',{points:pts.map(p=>p.join(',')).join(' '),class:'mk-sel','stroke-width':'1px'},grp);
    } else if(m.kind==='zone'){
      el('polygon',{points:pts.map(p=>p.join(',')).join(' '),class:'mk-zone','stroke-width':sw,'stroke-dasharray':m.sub==='wet'?'5 3':''},grp);
      if(sel) el('polygon',{points:pts.map(p=>p.join(',')).join(' '),class:'mk-sel','stroke-width':'1px'},grp);
    } else if(m.kind==='sign'){
      const [x,y]=pts[0]; const r=9*k;
      el('path',{d:`M${x} ${y-r*1.2}L${x+r} ${y+r*.7}L${x-r} ${y+r*.7}Z`,fill:m.sub==='alarm'?'var(--mark)':'var(--paper)',stroke:'var(--mark)','stroke-width':sw},grp);
      const t=el('text',{x:x,y:y+r*.45,'font-size':10*k,'text-anchor':'middle',class:'mk-txt',style:'stroke-width:0'},grp);
      t.textContent={defl:'f',win:'×',meas:'△',alarm:'!',corr:'к',other:'?'}[m.sub]||'?';
      if(m.sub==='alarm') t.setAttribute('style','fill:var(--paper);stroke-width:0');
      if(sel) el('circle',{cx:x,cy:y,r:r*1.8,class:'mk-sel','stroke-width':'1px'},grp);
    } else if(m.kind==='photo'){
      const [x,y]=pts[0]; const r=6*k;
      if(m.dir!=null){const a=m.dir, L=34*k, s=0.42;
        el('path',{d:`M${x} ${y}L${x+L*Math.cos(a-s)} ${y+L*Math.sin(a-s)}A${L} ${L} 0 0 1 ${x+L*Math.cos(a+s)} ${y+L*Math.sin(a+s)}Z`,class:'mk-cone','stroke-width':'1px'},grp)}
      el('circle',{cx:x,cy:y,r:r,class:'mk-photo','stroke-width':'1.5px'},grp);
      const n=localPhotoCount(m.id);
      const t=el('text',{x:x+r*1.3,y:y-r*1.1,'font-size':11*k,class:'mk-txt',style:'fill:var(--photo)'},grp); t.textContent=n?('ф'+n):'ф0';
      if(sel) el('circle',{cx:x,cy:y,r:r*2.4,class:'mk-sel','stroke-width':'1px'},grp);
    }
    const lab=labelOf(m);
    if(lab&&m.kind!=='photo'){
      const p=m.kind==='sign'?[pts[0][0]+12*k,pts[0][1]-8*k]:pts[Math.floor(pts.length/2)];
      const t=el('text',{x:p[0]+4*k,y:p[1]-4*k,'font-size':12*k,class:'mk-txt'},grp); t.textContent=(m.danger?'! ':'')+lab;
    }
  }
}
function localPhotoCount(mid){let n=0;for(const p of st.photos.values())if(p.mark===mid)n++;return n}

/* ---------- view: pan / zoom ---------- */
function zoomAt(f,cx,cy){ const [x,y,w,h]=st.vb; const nw=w*f, nh=h*f; st.vb=[cx-(cx-x)*f, cy-(cy-y)*f, nw, nh]; applyVB(); }
$('#zin').onclick=()=>{const [x,y,w,h]=st.vb;zoomAt(0.7,x+w/2,y+h/2)};
$('#zout').onclick=()=>{const [x,y,w,h]=st.vb;zoomAt(1/0.7,x+w/2,y+h/2)};
$('#zfit').onclick=()=>{st.vb=[...st.fit];applyVB()};
$('#plan').addEventListener('wheel',e=>{e.preventDefault();const [cx,cy]=toSvg(e);zoomAt(e.deltaY>0?1.15:1/1.15,cx,cy)},{passive:false});

const ptrs=new Map(); let gesture=null, drawing=null;
const drawsWith = e => e.pointerType==='pen' || (e.pointerType==='mouse'&&st.tool!=='pan') || (e.pointerType==='touch'&&st.finger&&st.tool!=='pan');
$('#plan').addEventListener('pointerdown',e=>{
  $('#plan').setPointerCapture(e.pointerId);
  if(drawsWith(e) && ['photo','crack','zone','sign'].includes(st.tool) && ptrs.size===0){
    drawing={tool:st.tool,pts:[toSvg(e)],id:e.pointerId,t0:Date.now()}; renderDraft(); return;
  }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:Date.now()});
  if(ptrs.size===2){drawing=null;renderDraft();}
});
$('#plan').addEventListener('pointermove',e=>{
  if(drawing&&drawing.id===e.pointerId){
    const p=toSvg(e), last=drawing.pts[drawing.pts.length-1];
    if(Math.hypot(p[0]-last[0],p[1]-last[1])>scale()*2.5){drawing.pts.push(p);renderDraft();}
    return;
  }
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId); const cur={...prev,x:e.clientX,y:e.clientY};
  if(ptrs.size===1){ const k=scale(); st.vb[0]-= (cur.x-prev.x)*k; st.vb[1]-=(cur.y-prev.y)*k; ptrs.set(e.pointerId,cur); applyVB(); }
  else if(ptrs.size===2){
    const [a,b]=[...ptrs.entries()]; const other=a[0]===e.pointerId?b[1]:a[1];
    const d0=Math.hypot(prev.x-other.x,prev.y-other.y), d1=Math.hypot(cur.x-other.x,cur.y-other.y);
    const mid={clientX:(cur.x+other.x)/2,clientY:(cur.y+other.y)/2}; const [cx,cy]=toSvg(mid);
    if(d1>0) zoomAt(d0/d1,cx,cy);
    const k=scale(); st.vb[0]-=(cur.x-prev.x)/2*k; st.vb[1]-=(cur.y-prev.y)/2*k;
    ptrs.set(e.pointerId,cur); applyVB();
  }
});
function endPtr(e){
  if(drawing&&drawing.id===e.pointerId){ const d=drawing; drawing=null; renderDraft(); finishDraw(d); return; }
  const p=ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if(p&&ptrs.size===0&&Math.hypot(p.x-p.sx,p.y-p.sy)<8&&Date.now()-p.t<400) tapSelect(e);
}
$('#plan').addEventListener('pointerup',endPtr);
$('#plan').addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId); if(drawing&&drawing.id===e.pointerId){drawing=null;renderDraft();}});

function renderDraft(){
  const d=$('#draft');
  if(!drawing){d.setAttribute('d','');return}
  const p=drawing.pts;
  if(drawing.tool==='photo'&&p.length>1){const a=p[0],b=p[p.length-1];d.setAttribute('d',`M${a[0]} ${a[1]}L${b[0]} ${b[1]}`)}
  else d.setAttribute('d','M'+p.map(q=>q.join(' ')).join('L')+(drawing.tool==='zone'?'Z':''));
  d.setAttribute('stroke-width','2.5px'); d.style.vectorEffect='non-scaling-stroke';
}

function simplify(pts,eps){ if(pts.length<3)return pts; let dmax=0,idx=0; const [a,b]=[pts[0],pts[pts.length-1]];
  for(let i=1;i<pts.length-1;i++){const d=segDist(pts[i],a,b); if(d>dmax){dmax=d;idx=i}}
  if(dmax>eps){const l=simplify(pts.slice(0,idx+1),eps), r=simplify(pts.slice(idx),eps); return l.slice(0,-1).concat(r)} return [a,b]; }
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const L=dx*dx+dy*dy; if(!L)return Math.hypot(p[0]-a[0],p[1]-a[1]); let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
const polyLen = pts => pts.reduce((s,p,i)=>i?s+Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1]):0,0);
const polyArea = pts => Math.abs(pts.reduce((s,p,i)=>{const q=pts[(i+1)%pts.length];return s+p[0]*q[1]-q[0]*p[1]},0)/2);

function finishDraw(d){
  const k=scale(); const svgPts=d.pts;
  const moved=svgPts.length<2?0:Math.hypot(svgPts[svgPts.length-1][0]-svgPts[0][0],svgPts[svgPts.length-1][1]-svgPts[0][1]);
  if(moved<6*k && Date.now()-d.t0<450){ const hit=hitTest(svgPts[0]); if(hit){st.sel=hit.id;drawMarks();openPanel(hit);return} }
  const m={id:uid(),sheet:st.sheet,kind:d.tool,t:now(),by:userId,danger:false,photos:[]};
  if(d.tool==='photo'){
    m.pts=[toModel(svgPts[0])];
    if(svgPts.length>1){const a=svgPts[0],b=svgPts[svgPts.length-1]; if(Math.hypot(b[0]-a[0],b[1]-a[1])>12*k) m.dir=Math.atan2(b[1]-a[1],b[0]-a[0]);}
  } else if(d.tool==='crack'){
    if(svgPts.length<2){toast('Проведіть лінію тріщини');return}
    const s=simplify(svgPts,k*1.5); m.pts=s.map(toModel); m.len=(polyLen(m.pts)/1000).toFixed(1).replace('.',','); m.w='';
  } else if(d.tool==='zone'){
    if(svgPts.length<3){toast('Обведіть ділянку');return}
    const s=simplify(svgPts,k*2); m.pts=s.map(toModel); m.area=(polyArea(m.pts)/1e6).toFixed(1).replace('.',','); m.sub='ruin';
  } else if(d.tool==='sign'){ m.pts=[toModel(svgPts[0])]; m.sub='meas'; m.params=''; }
  m.draft=true; st.marks.set(m.id,m); st.sel=m.id; drawMarks(); openPanel(m);
}

/* ---------- select by tap ---------- */
function tapSelect(e){
  const best=hitTest(toSvg(e));
  if(best){st.sel=best.id;drawMarks();openPanel(best)} else if(st.sel){st.sel=null;closePanel();drawMarks()}
}
function hitTest([x,y]){
  const k=scale(); let best=null,bd=22*k;
  for(const m of st.marks.values()){ if(m.sheet!==st.sheet||m.deleted)continue;
    const pts=m.pts.map(fromModel); let d=Infinity;
    if(pts.length===1) d=Math.hypot(pts[0][0]-x,pts[0][1]-y);
    else for(let i=1;i<pts.length;i++) d=Math.min(d,segDist([x,y],pts[i-1],pts[i]));
    if(m.kind==='zone'&&inPoly([x,y],pts)) d=Math.min(d,bd*0.9);
    if(d<bd){bd=d;best=m}
  }
  return best;
}
function inPoly(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a[1]>p[1])!==(b[1]>p[1]))&&(p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]))c=!c}return c}

/* ---------- mark panel ---------- */
function chips(list,cur,onPick){const r=document.createElement('div');r.className='row';for(const [v,t] of list){const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',String(v===cur));b.onclick=()=>{onPick(v);[...r.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)))};r.appendChild(b)}return r}
function field(label,val,onIn,opts={}){const w=document.createElement('label');w.className='fld';const s=document.createElement('span');s.className='lbl';s.textContent=label;const i=document.createElement(opts.area?'textarea':'input');if(!opts.area){i.type='text';i.inputMode=opts.mode||'text'}else i.rows=2;i.value=val||'';i.id='f_'+label.replace(/\W/g,'');i.oninput=()=>onIn(i.value);w.append(s,i);return w}
function openPanel(m){
  const P=$('#panel'); P.hidden=false; P.innerHTML='';
  const head=document.createElement('div');head.className='phead';
  const h=document.createElement('h3'); h.textContent=KIND[m.kind]+(m.draft?' — нова':'')+' · '+hhmm(m.t); head.appendChild(h); P.appendChild(head);
  const work={...m};
  if(m.kind==='crack'){
    const r=document.createElement('div');r.className='row';
    r.append(field('Ширина, мм',work.w,v=>work.w=v,{mode:'decimal'}),field('Довжина, м',work.len,v=>work.len=v,{mode:'decimal'}));
    P.appendChild(r);
    const r2=chips([['n','Ні'],['y','Наскрізна']],work.through?'y':'n',v=>work.through=v==='y'); r2.prepend(Object.assign(document.createElement('span'),{className:'lbl',textContent:'Наскрізна'})); P.appendChild(r2);
  }
  if(m.kind==='zone'){ const l=document.createElement('span');l.className='lbl';l.textContent='Тип';P.appendChild(l);P.appendChild(chips(ZONES,work.sub,v=>work.sub=v));
    const r=document.createElement('div');r.className='row';r.append(field('Площа, м²',work.area,v=>work.area=v,{mode:'decimal'}));P.appendChild(r)}
  if(m.kind==='sign'){ const l=document.createElement('span');l.className='lbl';l.textContent='Тип';P.appendChild(l);P.appendChild(chips(SIGNS,work.sub,v=>work.sub=v));
    const r=document.createElement('div');r.className='row';r.append(field('Параметри (f, мм / що виміряно)',work.params,v=>work.params=v));P.appendChild(r)}
  if(m.kind!=='photo'){ const l=document.createElement('span');l.className='lbl';l.textContent='Конструкція';P.appendChild(l);P.appendChild(chips(SURF,work.surf,v=>work.surf=v)); }
  const r3=chips([['n','Звичайний'],['y','Небезпечний (червоне)']],work.danger?'y':'n',v=>work.danger=v==='y'); P.appendChild(r3);
  P.appendChild(field('Примітка',work.note,v=>work.note=v,{area:true}));
  /* photos */
  const pl=document.createElement('span');pl.className='lbl';pl.textContent='Фото';P.appendChild(pl);
  const th=document.createElement('div');th.className='thumbs';P.appendChild(th);
  const showThumbs=()=>{th.innerHTML='';
    for(const p of st.photos.values()) if(p.mark===m.id){const i=document.createElement('img');i.src=URL.createObjectURL(p.blob);i.alt='фото';th.appendChild(i)}};
  showThumbs();
  const pr=document.createElement('div');pr.className='row';
  const mkPick=(txt,cls,cap,multi)=>{const l=document.createElement('label');l.className='pbtn'+(cls?' '+cls:'');l.append(txt);
    const i=document.createElement('input');i.type='file';i.accept='image/*';if(cap)i.setAttribute('capture','environment');if(multi)i.multiple=true;i.id='pick_'+(cap?'cam':'gal');
    i.addEventListener('change',()=>handlePhotos(i,work,showThumbs));l.appendChild(i);return l};
  pr.append(mkPick('Зробити фото','',true,false),mkPick('З галереї','sec',false,true)); P.appendChild(pr);
  if(m.kind==='photo'){const tb=document.createElement('div');tb.className='tbox';
    tb.innerHTML='<b>Точка зйомки · '+new Date(m.t).toTimeString().slice(0,8)+'</b><br>Натисніть «Зробити фото» — знімок одразу прикріпиться до точки. Можна й звичайною камерою телефону: фото з цього моменту до наступної точки прив\'яжуться за часом.';P.insertBefore(tb,head.nextSibling);}
  
  /* actions */
  const ar=document.createElement('div');ar.className='row';ar.style.justifyContent='space-between';
  const bSave=Object.assign(document.createElement('button'),{type:'button',className:'pbtn',textContent:'Зберегти'});
  const bDel=Object.assign(document.createElement('button'),{type:'button',className:'pbtn del',textContent:m.draft?'Скасувати':'Видалити'});
  const confirmRow=document.createElement('div');confirmRow.className='row';confirmRow.hidden=true;
  bSave.onclick=async()=>{const nm={...work};delete nm.draft;st.marks.set(nm.id,nm);st.undo.push(nm.id);await saveMark(nm);closePanel();st.sel=null;drawMarks();toast('Збережено')};
  bDel.onclick=()=>{ if(m.draft){st.marks.delete(m.id);closePanel();st.sel=null;drawMarks();return} confirmRow.hidden=false; };
  const yes=Object.assign(document.createElement('button'),{type:'button',className:'pbtn del',textContent:'Так, видалити позначку'});
  const no=Object.assign(document.createElement('button'),{type:'button',className:'pbtn sec',textContent:'Ні'});
  yes.onclick=async()=>{const nm={...m,deleted:true};st.marks.set(nm.id,nm);await saveMark(nm);closePanel();st.sel=null;drawMarks();toast('Видалено')};
  no.onclick=()=>confirmRow.hidden=true; confirmRow.append(yes,no);
  const close=Object.assign(document.createElement('button'),{type:'button',className:'pbtn sec',textContent:'Закрити'});
  close.onclick=()=>{if(m.draft){st.marks.delete(m.id)}closePanel();st.sel=null;drawMarks()};
  const hb=document.createElement('div');hb.className='row';hb.append(bSave,close,bDel);head.appendChild(hb);
  P.insertBefore(confirmRow,head.nextSibling);
}
function closePanel(){$('#panel').hidden=true;$('#panel').innerHTML=''}

/* ---------- photos ---------- */
async function handlePhotos(inp,work,after){
  const files=[...inp.files]; inp.value=''; if(!files.length)return;
  const m=st.marks.get(work.id);
  if(m&&m.draft){ const nm={...m,...work};delete nm.draft;st.marks.set(nm.id,nm);st.undo.push(nm.id);await saveMark(nm); }
  for(const f of files){ const blob=await shrink(f); const p={id:uid(),mark:work.id,blob,taken:new Date(f.lastModified||Date.now()).toISOString(),name:f.name}; st.photos.set(p.id,p); await putLocal('photos',p); }
  toast('Фото додано: '+files.length); after&&after(); drawMarks(); updateSync(); syncSoon();
}
async function shrink(file){
  try{ const bmp=await createImageBitmap(file); const M=2560; const s=Math.min(1,M/Math.max(bmp.width,bmp.height));
    if(s>=1&&file.size<6e6&&file.type==='image/jpeg')return file;
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.85)); }catch(e){return file}
}

/* ---------- persistence (device only) ---------- */
async function saveMark(m){ m.updated=now(); await putLocal('marks',m); updateSync(); }
function syncSoon(){}
function updateSync(){
  const n=[...st.marks.values()].filter(m=>!m.deleted&&!m.draft).length, ph=st.photos.size;
  const s=$('#sync'); s.textContent=`${n} позн. · ${ph} фото`; s.className='pill';
}
/* ---------- ZIP export (store, no compression) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
async function makeZip(files){ /* files: [{name, data:Uint8Array}] */
  const enc=new TextEncoder(); const parts=[], central=[]; let off=0;
  const d=new Date(); const dt=((d.getFullYear()-1980)<<25)|((d.getMonth()+1)<<21)|(d.getDate()<<16)|(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){ const nm=enc.encode(f.name), c=crc32(f.data), sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint32(10,dt,true);h.setUint32(14,c,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint32(12,dt,true);ch.setUint32(16,c,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm); off+=30+nm.length+sz; }
  const cs=central.reduce((s,x)=>s+x.length,0);
  const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/zip'});
}
async function exportAll(){
  toast('Готую архів…');
  const marks=[...st.marks.values()].filter(m=>!m.draft);
  const visits=(await kvGet('visitsLog'))||[]; if(visit) visits.push({...visit,open:true});
  const photos=[...st.photos.values()];
  const files=[]; const meta=[];
  for(const p of photos){ const m=st.marks.get(p.mark); const sh=m?m.sheet:'x'; const name=`photos/${sh}_${p.taken.replace(/[:.]/g,'-')}_${p.id}.jpg`;
    files.push({name,data:new Uint8Array(await p.blob.arrayBuffer())}); meta.push({id:p.id,mark:p.mark,taken:p.taken,orig:p.name||'',file:name}); }
  const data={app:'lustdorf-field',version:1,exported:now(),units:'mm (координати моделі DXF)',sheets:SHEETS.map(s=>({id:s.id,lit:s.lit,name:s.name,floor:s.floor})),marks,photos:meta,visits};
  files.unshift({name:'marks.json',data:new TextEncoder().encode(JSON.stringify(data,null,1))});
  const zip=await makeZip(files); const fname=`lustdorf_${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.zip`;
  const file=new File([zip],fname,{type:'application/zip'});
  const P=$('#panel'); P.hidden=false; P.innerHTML='';
  const h=document.createElement('h3'); h.textContent=`Архів готовий: ${marks.filter(m=>!m.deleted).length} позначок, ${photos.length} фото, ${(zip.size/1048576).toFixed(1)} МБ`; P.appendChild(h);
  const r=document.createElement('div'); r.className='row';
  const a=document.createElement('a'); a.className='pbtn'; a.textContent='Зберегти в Завантаження'; a.href=URL.createObjectURL(zip); a.download=fname; r.appendChild(a);
  const jsonTxt=new File([files[0].data],fname.replace('.zip','')+'_marks.txt',{type:'text/plain'});
  const jpgs=photos.map((p,i)=>new File([p.blob],meta[i].file.split('/').pop(),{type:'image/jpeg'}));
  const sb=Object.assign(document.createElement('button'),{type:'button',className:'pbtn sec',textContent:'Надіслати (Telegram, Drive…)'});
  sb.onclick=async()=>{
    if(!navigator.share){toast('Надсилання не підтримується — збережіть у Завантаження');return}
    const tries=[[file],[jsonTxt,...jpgs]];
    for(const fl of tries){
      try{ if(navigator.canShare&&!navigator.canShare({files:fl}))continue; await navigator.share({files:fl,title:fname}); return; }
      catch(e){ if(e&&e.name==='AbortError')return; }
    }
    toast('Не вдалося надіслати. Збережіть у Завантаження і прикріпіть файл у Telegram (скріпка → Файл).');
  };
  r.appendChild(sb);
  const c=Object.assign(document.createElement('button'),{type:'button',className:'pbtn sec',textContent:'Закрити'}); c.onclick=closePanel; r.appendChild(c);
  P.appendChild(r);
  const n=document.createElement('div'); n.className='note'; n.textContent='Дані залишаються на пристрої і після експорту. Архів можна робити скільки завгодно разів — кожен містить усе.'; P.appendChild(n);
}
$('#btnExport').onclick=exportAll;

/* ---------- visits (entry / exit per sheet) ---------- */
let visit=null;
async function startVisit(){ if(visit) await endVisit(); visit={id:uid(),sheet:st.sheet,in:now()}; $('#visit').textContent='вхід '+hhmm(visit.in); await kvSet('visit',visit); }
async function endVisit(){ if(!visit)return; visit.out=now(); const log=(await kvGet('visitsLog'))||[]; log.push(visit); await kvSet('visitsLog',log); visit=null; await kvSet('visit',null); }

/* ---------- list ---------- */
$('#btnList').onclick=()=>{ const L=$('#list'); if(!L.hidden){L.hidden=true;return} L.hidden=false; L.innerHTML='';
  const h=document.createElement('h3'); const s=sheetById(st.sheet); h.textContent=`Літ. ${s.lit} · ${s.floor}`; L.appendChild(h);
  const items=[...st.marks.values()].filter(m=>m.sheet===st.sheet&&!m.deleted&&!m.draft).sort((a,b)=>a.t<b.t?-1:1);
  if(!items.length){const p=document.createElement('p');p.textContent='На цьому аркуші ще немає позначок. Оберіть інструмент унизу і поставте позначку стилусом.';L.appendChild(p)}
  for(const m of items){ const r=document.createElement('div'); r.className='li';
    const sub=m.kind==='zone'?ZTXT[m.sub]:m.kind==='sign'?STXT[m.sub]:'';
    r.innerHTML=`<span class="badge">${hhmm(m.t)}</span><div><b>${KIND[m.kind]}${sub?': '+sub:''}</b>${m.danger?' <span class="danger">!</span>':''}<br><small>${[labelOf(m),m.surf?SFTXT[m.surf]:'',m.note||''].filter(Boolean).join(' · ')}</small></div><span class="badge">ф${localPhotoCount(m.id)}</span>`;
    r.onclick=()=>{ const p=fromModel(m.pts[0]); const [,,w,hh]=st.vb; st.vb=[p[0]-w/2,p[1]-hh/2,w,hh]; st.sel=m.id; applyVB(); L.hidden=true; openPanel(m); };
    L.appendChild(r);}
  const c=Object.assign(document.createElement('button'),{type:'button',className:'pbtn sec',textContent:'Закрити'}); c.style.marginTop='10px'; c.onclick=()=>L.hidden=true; L.appendChild(c);
};

/* ---------- tools ---------- */
const HINT={pan:'Палець — рух і масштаб. Торкніться позначки, щоб відкрити, змінити або видалити її.',photo:'Стилусом: точка зйомки, потягніть — напрямок. Далі знімайте камерою телефону.',crack:'Стилусом проведіть тріщину вздовж стіни.',zone:'Стилусом обведіть ділянку (вивал, замокання…).',sign:'Стилусом торкніться місця знака.'};
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{
  const t=b.dataset.tool;
  if(t==='undo'){ const id=st.undo.pop(); if(!id){toast('Нічого відміняти');return} const m=st.marks.get(id); if(m){const nm={...m,deleted:true};st.marks.set(id,nm);saveMark(nm);drawMarks();toast('Останню позначку прибрано')} return; }
  st.tool=t; document.querySelectorAll('.tool[data-tool]').forEach(x=>{if(x.dataset.tool!=='undo')x.setAttribute('aria-pressed',String(x===b))}); $('#hint').textContent=HINT[t]+(st.finger?'':' (пальцем — лише рух)');
});
$('#btnFinger').onclick=()=>{st.finger=!st.finger;$('#btnFinger').classList.toggle('on',st.finger);$('#btnFinger').setAttribute('aria-pressed',String(st.finger));toast(st.finger?'Пальцем можна малювати; рух — двома пальцями':'Малює лише стилус')};
$('#sheet').onchange=async e=>{st.sheet=e.target.value; closePanel(); st.sel=null; drawBase(); await startVisit(); kvSet('sheet',st.sheet);};

let toastT=null; function toast(t){const x=$('#toast');x.textContent=t;x.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>x.hidden=true,2200)}

/* ---------- boot ---------- */
(async function boot(){
  idb=await openIdb();
  const lastSheet=await kvGet('sheet'); if(lastSheet&&sheetById(lastSheet)) st.sheet=lastSheet;
  for(const m of (await allLocal('marks'))||[]) st.marks.set(m.id,m);
  for(const p of (await allLocal('photos'))||[]) st.photos.set(p.id,p);
  fillSelect(); drawBase(); $('#hint').textContent=HINT.pan; updateSync();
  const v=await kvGet('visit'); if(v&&v.sheet===st.sheet){visit=v;$('#visit').textContent='вхід '+hhmm(v.in)} else await startVisit();
  try{ navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{}) }catch(e){}
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist() }catch(e){}
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
